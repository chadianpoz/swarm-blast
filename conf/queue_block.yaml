# ---- added for e3l (adaptive adversary on LLMs), e7 (time to detect), e8 (horizontal transfer) ----
adapt:
  variants: [exact, wrapper, full]   # exact = original payload; wrapper = rewrite the wrapper, keep the core verbatim; full = restate everything in own words
  seeds: 8                           # infected runs per variant and topology
  threshold: 0.35                    # for the "full" variant: tag present and this fraction of core words reproduced counts as infected
ttd:
  topologies: [star, complete, chain]
  mu_core: [0.0, 0.2, 0.4]
  mu_wrap: 0.9
  seeds: 10
  neg: 20                            # benign mock runs used to calibrate per-tick thresholds
  alpha: 0.0                         # 0 = threshold is the max benign score at that tick (zero false alarms on the calibration set)
  persist: 2                         # score must stay above threshold this many consecutive ticks before the detector trips
hgt:
  topologies: [star, complete, chain]
  recomb: [0.0, 0.3, 0.6, 1.0]       # planted probability that the wrapper comes from a different message than the core
  mu_core: 0.08
  mu_wrap: 0.15
  seeds: 20
  max_taxa: 60
  n_perm: 199